name: Java CI with Maven

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rest-service-jar
        path: target/rest-service-0.0.2-SNAPSHOT.jar

  download-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Get Most Recent Artifact Download URL
      run: |
        ARTIFACTS_JSON=$(curl -s -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.HUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts")
        echo "Artifact JSON: $ARTIFACTS_JSON"
        LATEST_ARTIFACT_URL=$(echo "$ARTIFACTS_JSON" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .archive_download_url')
        echo "artifact_url=$LATEST_ARTIFACT_URL" >> $GITHUB_OUTPUT

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "Downloading the most recent artifact from: ${{ steps.get-url.outputs.artifact_url }}"
          wget -vvv -O latest_artifact.zip "${{ steps.get-url.outputs.artifact_url }}"
          unzip -o latest_artifact.zip -d ./extracted
          echo "Deployment completed successfully."
