name: Java CI with Maven

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rest-service-jar
        path: target/rest-service-0.0.2-SNAPSHOT.jar

  download-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Get Most Recent Artifact ID
      run: |
        ARTIFACT_ID_JSON=$(curl -s -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.HUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts")
        ARTIFACT_ID=$(echo "$ARTIFACT_ID_JSON" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')
        echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_ENV


    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "Downloading the most recent artifact from: ${{ steps.get-artifacts.outputs.url }}"
          wget -vvv -O latest_artifact.zip "${{ steps.get-artifacts.outputs.url }}" || { echo "Download failed"; exit 1; }
          unzip -o latest_artifact.zip -d ./extracted
          echo "Deployment completed successfully."

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: 
          if [[ -z "$ARTIFACT_ID" ]]; then
        echo "Error: No valid artifact ID found."
            exit 1
          fi"
            ARTIFACT_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip"
        echo "Downloading artifact from: $ARTIFACT_URL"
        wget -vvv -O latest_artifact.zip --header="Authorization: Bearer ${{ secrets.HUB_TOKEN }}" "$ARTIFACT_URL"
          unzip -o latest_artifact.zip -d ./extracted
          echo "Deployment completed successfully."
