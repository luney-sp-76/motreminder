name: Java CI with Maven

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rest-service-jar
        path: target/rest-service-0.0.2-SNAPSHOT.jar

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
    - name: Debug solo
      run: |
        sudo -l
    - name: Who am I?
      run: |
        echo "Running as: $(whoami)"
        id
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: rest-service-jar

    - name: Deploy Green Instance (8081)
      run: |
        echo "Copying artifact to deployment path..."
        mkdir -p /home/paul/motbookingreminder
        cp rest-service-0.0.2-SNAPSHOT.jar /home/paul/motbookingreminder/

        echo "Switching to Green Service (8081)..."
        /home/paul/update_port.sh 8081
        sudo systemctl daemon-reload
        sudo systemctl restart motbookingreminder2.service
        sleep 5

        echo "Updating Nginx Configuration..."
        export SERVICE_PORT=8081
        envsubst '$SERVICE_PORT' < /etc/nginx/conf.d/motbookingreminder.conf.template > /etc/nginx/conf.d/motbookingreminder.conf
        sudo nginx -s reload
        sleep 10

        echo "Performing Health Check..."
        max_attempts=5
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080)
          if [ "$STATUS" -eq 200 ]; then
            echo "Health check successful."

            echo "Updating Blue backup JAR..."
            cp /home/paul/motbookingreminder/rest-service-0.0.2-SNAPSHOT.jar /home/paul/motbookingreminder/rest-service-0.0.1-SNAPSHOT.jar
            break
          else
            echo "Health check failed (attempt $attempt, status $STATUS)."
            if [ $attempt -eq $max_attempts ]; then
              echo "Health check failed after $max_attempts attempts. Reverting to Blue (8082)..."
              sudo systemctl stop motbookingreminder2.service
              /home/paul/update_port.sh 8082
              export SERVICE_PORT=8082
              envsubst '$SERVICE_PORT' < /etc/nginx/conf.d/motbookingreminder.conf.template > /etc/nginx/conf.d/motbookingreminder.conf
              sudo nginx -s reload
              sudo systemctl restart motbookingreminder.service
              echo "Reverted to Blue."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 10
          fi
        done

        echo "Green deployment successful!"
