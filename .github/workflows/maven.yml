# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rest-service-0.0.2-SNAPSHOT
        path: target/rest-service-0.0.2-SNAPSHOT.jar

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22 # Optional if you use the standard SSH port
        script: |
          set -e  # Stop the script if any command fails
          cd /home/paulolphert/
          echo "Downloading ZIP file..."
          wget -vvv -O latest_artifact.zip "$ARTIFACT_URL"
          echo "Checking the contents of the directory..."
          ls -alh  # List all files to confirm the ZIP file is downloaded
          echo "Attempting to unzip latest_artifact.zip"
          unzip -o -v latest_artifact.zip -d ./extracted || { echo "Failed to unzip"; exit 1; }
          echo "Unzip successful, moving files..."
          mv ./extracted/*.jar ./rest-service-0.0.2-SNAPSHOT.jar
          echo "Deployment completed successfully."
          rm -f latest_artifact.zip
          rm -rf ./extracted
        
