name: Java CI with Maven

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rest-service-jar
        path: target/rest-service-0.0.2-SNAPSHOT.jar

  download-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Get Most Recent Artifact ID
      id: fetch-artifact-id
      run: |
        ARTIFACTS_JSON=$(curl -s -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.HUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts")
        ARTIFACT_ID=$(echo "$ARTIFACTS_JSON" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')
        echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_ENV
        echo "::set-output name=artifact_id::$ARTIFACT_ID"

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          if [[ -z "${{ steps.fetch-artifact-id.outputs.artifact_id }}" ]]; then
            echo "Error: No valid artifact ID found."
            exit 1
          fi
          ARTIFACT_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.fetch-artifact-id.outputs.artifact_id }}/zip"
          echo "Downloading artifact from: $ARTIFACT_URL"
          curl -L -o latest_artifact.zip \
            -H "Authorization: Bearer ${{ secrets.HUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ARTIFACT_URL"
          unzip -o latest_artifact.zip -d ./extracted
          echo "Moving extracted files to the deployment directory..."
          sudo mv ./extracted/* /home/paulolphert/motbookingreminder/
          echo "Cleaning up temporary files..."
          rm -f latest_artifact.zip
          rm -rf ./extracted
          echo "Deployment completed successfully."
         
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Start Green Service
      run: |
        ssh -tt ${{ secrets.SSH_USER }}@${{ secrets.HOST }} 'sudo systemctl start motbookingreminder2.service'

    - name: Update Nginx Configuration for Blue-Green Deployment
      run: |
        ssh -tt ${{ secrets.SSH_USER }}@${{ secrets.HOST }} '
        export SERVICE_PORT=8081  # Set to 8081 for green deployment
        envsubst '$SERVICE_PORT' < /path/to/motbookingreminder.conf.template > /etc/nginx/conf.d/motbookingreminder.conf
        sudo nginx -s reload'

    - name: Health Check Green Service
      run: |
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://motbookingreminder.co.uk/healthcheck)
        if [ "$STATUS" -ne 200 ]; then
          echo "Health check failed for Green environment; status code: $STATUS"
          ssh -tt ${{ secrets.SSH_USER }}@${{ secrets.HOST }} '
          export SERVICE_PORT=8082  # Revert to 8082 for blue deployment
          envsubst '$SERVICE_PORT' < /path/to/motbookingreminder.conf.template > /etc/nginx/conf.d/motbookingreminder.conf
          sudo nginx -s reload'
          exit 1
        fi

    - name: Confirm Deployment
      run: |
        echo "Green deployment successful and verified!"

