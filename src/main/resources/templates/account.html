<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Profile</title>
    <link rel="stylesheet" href="/css/mot.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div th:replace="~{navbar :: common-navbar}"></div>
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div id="alert-placeholder"></div>
        <div class="card">
          <div class="card-body">
            <h2 class="card-title">Account Profile</h2>

          
            <!-- Update Car Registration Number -->
            <form id="updateCarRegForm" class="mb-3">
              <h4 id="updateCarRegHeader">Update Car Registration Number</h4>
              <div class="form-group">
                <input type="text" class="form-control" id="newCarReg" placeholder="New Registration Number" />
              </div>
              <button type="button" id="updateCarRegBtn" class="btn btn-primary">Update Car Registration</button>
            </form>

            <!-- Remove Reminder -->
            <div id="removeReminderSection" class="mb-3">
              <h4>Remove Reminder</h4>
              <button type="button" id="removeReminderBtn" class="btn btn-primary">Remove Reminder</button>
            </div>

             <!-- Update Email Address -->
             <form id="updateEmailForm" class="mb-3">
              <h4>Update Email Address</h4>
              <div class="form-group">
                <input type="email" class="form-control" id="newEmail" placeholder="New Email" />
              </div>
              <button type="button" id="updateEmailBtn" class="btn btn-primary">Update Email</button>
            </form>

            <!-- Update Password -->
            <form id="resetPasswordForm" class="mb-3">
              <h4>Reset Password</h4>
              <button type="button" id="updatePasswordBtn" class="btn btn-primary">Reset Password</button>
            </form>

            <!-- Close Account -->
            <div id="closeAccountSection" class="mb-3">
              <h4>Close Account</h4>
              <button type="button" id="closeAccountBtn" class="btn btn-danger">Close Account</button>
            </div>

            <!-- Request Data Held -->
            <div id="requestDataSection" class="mb-3">
              <h4>Request Data Held</h4>
              <button type="button" id="gdprDataRequestBtn" class="btn btn-info">Request Data</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
    <script type="module">
      import { adjustLoginLogoutLink } from "/js/firebase-status.js";
      adjustLoginLogoutLink();
    </script>
    <script type="module">
      // Import necessary Firestore functions from the SDK.
      import { auth, db } from '/js/firebase-init.js';
      import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
      import {formatRegNumber} from '/js/format-regnumber.js';
  
      document.addEventListener("DOMContentLoaded", () => {
          auth.onAuthStateChanged((user) => {
              if (user) {
                  // Fetch the document using the user's UID.
                  const reminderDocRef = doc(db, "reminders", user.uid);
  
                  getDoc(reminderDocRef).then((docSnap) => {
                      if (docSnap.exists()) {
                          // Extract the registration number from the Firestore document.
                          const currentRegistrationNumber = docSnap.data().regNumber;

                          // Format the registration number correctly.
                          const formattedRegNumber = formatRegNumber(currentRegistrationNumber);

                          // Log the formatted registration number to the console.
                          console.log("Formatted registration number:", formattedRegNumber);
  
                          // Update the header with the current registration number.
                          document.getElementById('updateCarRegHeader').textContent = `Update ${formattedRegNumber} Car Registration Number`;
                      } else {
                          console.log("Document does not exist");
                          document.getElementById('updateCarRegHeader').textContent = "Update Car Registration Number";
                      }
                  }).catch((error) => {
                      console.error("Error fetching document:", error);
                      document.getElementById('updateCarRegHeader').textContent = "Error loading registration number.";
                  });
              } else {
                  console.log("User is not signed in");
                  // Redirect to login page if the user is not signed in.
                  window.location.href = "/login";
              }
          });
      });
  </script>
  
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script type ="module" src="/js/firebase-init.js">
    </script>
    <script type ="module" src="/js/account-profile.js">
    </script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  </body>
</html>
