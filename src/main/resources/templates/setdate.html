<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <style>
      .container {
        padding-top: 50px;
      }
      @keyframes pulseAnimation {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      .pulse {
        animation: pulseAnimation 1s infinite;
      }
    </style>
  </head>
  <body>
    <div th:replace="~{navbar :: common-navbar}"></div>
    <div class="container">
      <!-- Navigation breadcrumb -->
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/vehicles">My Vehicles</a></li>
          <li class="breadcrumb-item active" aria-current="page">Vehicle Reminders</li>
        </ol>
      </nav>
      
      <h1 id="registrationNumber" class="lead">Loading Registration...</h1>
      <h2 id="motExpiryDate" class="lead">Loading MOT Expiry Date...</h2>
      <h2 id="taxDueDate" class="lead">Loading Tax Due Date...</h2>
      
      <div class="row">
        <div class="container text-center mt-5">
          <h1>Your MOT Reminder</h1>
          <p id="displayMotReminderDate" class="lead">Loading reminder...</p>
          <a href="/setreminder" class="btn btn-primary" id="changeMotDateBtn">Change Date</a>
        </div>
      </div>
      <div class="row">
        <div class="container text-center mt-5">
          <h1>Your Tax Reminder</h1>
          <p id="displayTaxReminderDate" class="lead">Loading reminder...</p>
          <form id="taxReminderForm">
            <div class="form-group">
              <label for="taxReminderDate">Tax Reminder Date:</label>
              <input type="date" id="taxReminderDate" class="form-control" required>
            </div>
            <button type="button" class="btn btn-primary" id="setTaxReminderBtn">Set Tax Reminder</button>
          </form>
          <a href="/setreminder" class="btn btn-primary mt-3" id="changeTaxDateBtn">Change Date</a>
        </div>
      </div>
    </div>
    
    <script type="module">
        import { adjustLoginLogoutLink } from '/js/firebase-status.js'
        adjustLoginLogoutLink()
    </script>

    <script type="module">
      import { auth, db } from '/js/firebase-init.js';
      import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
      import { formatDateToDDMMMYYYY } from '/js/formatDateToDDMMYYYY.js';

      document.addEventListener("DOMContentLoaded", () => {
          auth.onAuthStateChanged(async (user) => {
              if (user) {
                  const selectedVehicle = localStorage.getItem("selectedVehicleForReminder") || localStorage.getItem("regNumber");
                  
                  if (!selectedVehicle) {
                      alert("No vehicle selected. Please select a vehicle first.");
                      window.location.href = "/vehicles";
                      return;
                  }
                  
                  console.log("Selected vehicle:", selectedVehicle);
                  
                  // Check if we have local vehicle data that needs to be saved first
                  const localVehicleData = localStorage.getItem('currentVehicleData');
                  if (localVehicleData) {
                      try {
                          const vehicleData = JSON.parse(localVehicleData);
                          const userDocRef = doc(db, "reminders", user.uid);
                          
                          // Save vehicle to Firebase first
                          await setDoc(userDocRef, {
                              email: user.email,
                              userID: user.uid,
                              [`vehicles.${vehicleData.regNumber}`]: vehicleData
                          }, { merge: true });
                          
                          console.log("Saved local vehicle data to Firebase");
                      } catch (error) {
                          console.error("Error saving local vehicle data:", error);
                      }
                  }

                  const reminderDocRef = doc(db, "reminders", user.uid); // Directly access the document using the user's UID

                  getDoc(reminderDocRef)
                      .then((docSnap) => {
                          if (docSnap.exists()) {
                              const data = docSnap.data();
                              let vehicleData = null;
                              
                              // Check if using new multi-vehicle structure
                              if (data.vehicles && data.vehicles[selectedVehicle]) {
                                  vehicleData = data.vehicles[selectedVehicle];
                              } else if (data.regNumber === selectedVehicle) {
                                  // Legacy single vehicle structure
                                  vehicleData = data;
                              }
                              
                              if (!vehicleData) {
                                  // Try to get data from localStorage as fallback
                                  const localVehicleData = localStorage.getItem('currentVehicleData');
                                  if (localVehicleData) {
                                      try {
                                          vehicleData = JSON.parse(localVehicleData);
                                          console.log("Using local vehicle data:", vehicleData);
                                      } catch (error) {
                                          console.error("Error parsing local vehicle data:", error);
                                      }
                                  }
                                  
                                  if (!vehicleData) {
                                      document.getElementById("registrationNumber").innerText = `Registration Number: ${selectedVehicle}`;
                                      document.getElementById("displayMotReminderDate").innerText = "Reminder Date: Not Available";
                                      document.getElementById("displayTaxReminderDate").innerText = "Reminder Date: Not Available";
                                      document.getElementById("motExpiryDate").innerText = "MOT Expiry Date: no expiry date";
                                      document.getElementById("taxDueDate").innerText = "Tax Due Date: no due date";
                                      return;
                                  }
                              }
                              
                              let motReminderDate = vehicleData.motReminderDate ? new Date(vehicleData.motReminderDate) : null;
                              const taxReminderDate = vehicleData.taxReminderDate ? new Date(vehicleData.taxReminderDate) : null;
                              const motExpiryDate = vehicleData.motExpiryDate ? new Date(vehicleData.motExpiryDate) : null;
                              const taxDueDate = vehicleData.taxDueDate ? new Date(vehicleData.taxDueDate) : null;

                              // Calculate MOT reminder date as 3 months before MOT expiry date
                              if (motExpiryDate && !motReminderDate) {
                                  motReminderDate = new Date(motExpiryDate);
                                  motReminderDate.setMonth(motReminderDate.getMonth() - 3);
                                  
                                  // Update the database with the calculated reminder date
                                  setDoc(reminderDocRef, {
                                      motReminderDate: motReminderDate.toISOString()
                                  }, { merge: true }).catch(error => {
                                      console.error("Error updating MOT reminder date:", error);
                                  });
                              } else if (motExpiryDate && motReminderDate) {
                                  // Check if we need to recalculate based on a new MOT expiry date
                                  const calculatedReminderDate = new Date(motExpiryDate);
                                  calculatedReminderDate.setMonth(calculatedReminderDate.getMonth() - 3);
                                  
                                  // If the stored reminder date is significantly different from calculated, update it
                                  const timeDiff = Math.abs(motReminderDate.getTime() - calculatedReminderDate.getTime());
                                  const daysDiff = timeDiff / (1000 * 3600 * 24);
                                  
                                  if (daysDiff > 7) { // If more than 7 days difference, update
                                      motReminderDate = calculatedReminderDate;
                                      setDoc(reminderDocRef, {
                                          motReminderDate: motReminderDate.toISOString()
                                      }, { merge: true }).catch(error => {
                                          console.error("Error updating MOT reminder date:", error);
                                      });
                                  }
                              }

                              const formattedMotReminderDate = motReminderDate ? formatDateToDDMMMYYYY(motReminderDate).replace(/\//g, '-') : "Not Available";
                              const formattedTaxReminderDate = taxReminderDate ? formatDateToDDMMMYYYY(taxReminderDate).replace(/\//g, '-') : "Not Available";
                              const formattedMotExpiryDate = motExpiryDate ? formatDateToDDMMMYYYY(motExpiryDate).replace(/\//g, '-') : "no expiry date";
                              const formattedTaxDueDate = taxDueDate ? formatDateToDDMMMYYYY(taxDueDate).replace(/\//g, '-') : "no due date";

                              document.getElementById("displayMotReminderDate").innerText = `Reminder Date: ${formattedMotReminderDate}`;
                              document.getElementById("displayTaxReminderDate").innerText = `Reminder Date: ${formattedTaxReminderDate}`;
                              document.getElementById("registrationNumber").innerText = `Registration Number: ${vehicleData.regNumber || selectedVehicle}`;
                              document.getElementById("motExpiryDate").innerText = `MOT Expiry Date: ${formattedMotExpiryDate}`;
                              document.getElementById("taxDueDate").innerText = `Tax Due Date: ${formattedTaxDueDate}`;

                              if (motReminderDate && motExpiryDate) {
                                  const daysBetween = Math.ceil((motExpiryDate - motReminderDate) / (1000 * 60 * 60 * 24));
                                  
                                  if (motReminderDate > motExpiryDate) {
                                      // Make the Change Date button pulse for MOT reminder
                                      document.getElementById("changeMotDateBtn").classList.add("pulse");

                                      // Add a note about the reminder and MOT expiry date issue
                                      const note = document.createElement("p");
                                      note.style.color = "red"; // Make the note stand out
                                      note.innerText = "Your MOT reminder date should not be after the MOT expiry date.";
                                      document.querySelector(".container").appendChild(note);
                                  } else if (daysBetween < 30) {
                                      // Warning if reminder is less than 30 days before expiry
                                      const note = document.createElement("p");
                                      note.style.color = "orange"; // Make the note stand out
                                      note.innerText = `Warning: Your MOT reminder is only ${daysBetween} days before expiry. Consider setting it earlier.`;
                                      document.querySelector(".container").appendChild(note);
                                  }
                              }

                              if (taxReminderDate && taxDueDate && taxReminderDate > taxDueDate) {
                                  // Make the Change Date button pulse for Tax reminder
                                  document.getElementById("changeTaxDateBtn").classList.add("pulse");

                                  // Add a note about the reminder and Tax due date issue
                                  const note = document.createElement("p");
                                  note.style.color = "red"; // Make the note stand out
                                  note.innerText = "Your Tax reminder date should not be after the Tax due date.";
                                  document.querySelector(".container").appendChild(note);
                              }

                          } else {
                              document.getElementById("displayMotReminderDate").innerText = "Reminder Date: Not Available";
                              document.getElementById("displayTaxReminderDate").innerText = "Reminder Date: Not Available";
                              document.getElementById("registrationNumber").innerText = `Registration Number: Not Available`;
                              document.getElementById("motExpiryDate").innerText = "MOT Expiry Date: no expiry date";
                              document.getElementById("taxDueDate").innerText = "Tax Due Date: no due date";
                          }
                      })
                      .catch(error => {
                          console.error("Error fetching reminder:", error);
                          document.getElementById("displayMotReminderDate").innerText = "Error loading reminder.";
                          document.getElementById("displayTaxReminderDate").innerText = "Error loading reminder.";
                          document.getElementById("registrationNumber").innerText = "Registration Number: Not Available";
                          document.getElementById("motExpiryDate").innerText = "MOT Expiry Date: Not Available";
                          document.getElementById("taxDueDate").innerText = "Tax Due Date: Not Available";
                      });
              } else {
                  console.log("User is not signed in");
                  // Handle not signed in state (optional)
                  window.location.href = "/login";
              }
          });

          document.getElementById("setTaxReminderBtn").addEventListener("click", async () => {
              const user = auth.currentUser;
              if (user) {
                  const taxReminderDateInput = document.getElementById("taxReminderDate").value;
                  const taxDueDateText = document.getElementById("taxDueDate").innerText.replace('Tax Due Date: ', '');
                  
                  if (!taxReminderDateInput) {
                      alert("Please select a tax reminder date.");
                      return;
                  }

                  // We need to parse the formatted date string back to a Date object for comparison
                  const taxDueDate = new Date(taxDueDateText);
                  if (taxDueDateText !== "no due date" && new Date(taxReminderDateInput) < taxDueDate) {
                      const taxReminderDate = new Date(taxReminderDateInput);
                      const selectedVehicle = localStorage.getItem("selectedVehicleForReminder") || localStorage.getItem("regNumber");
                      const reminderRef = doc(db, "reminders", user.uid);

                      try {
                          // Get current document to preserve existing vehicle data
                          const docSnap = await getDoc(reminderRef);
                          let vehicles = {};
                          
                          if (docSnap.exists()) {
                              const data = docSnap.data();
                              vehicles = data.vehicles || {};
                          }
                          
                          // Update or create the vehicle entry
                          if (!vehicles[selectedVehicle]) {
                              vehicles[selectedVehicle] = {};
                          }
                          
                          vehicles[selectedVehicle] = {
                              ...vehicles[selectedVehicle],
                              taxReminderDate: taxReminderDate.toISOString()
                          };
                          
                          await setDoc(reminderRef, {
                              email: user.email,
                              userID: user.uid,
                              vehicles: vehicles
                          }, { merge: true });

                          alert("Your Tax reminder has been set.");
                          window.location.href = "/setdate";
                      } catch (error) {
                          console.error("Error setting Tax reminder: ", error);
                          alert("Failed to set Tax reminder.");
                      }
                  } else {
                      if (taxDueDateText === "no due date") {
                          alert("Cannot set reminder as Tax due date is not available.");
                      } else {
                          alert("Tax reminder date must be before the Tax due date.");
                      }
                  }
              } else {
                  alert("Please sign in to set a reminder.");
                  window.location.href = "/login?redirect=set-reminder";
              }
          });
      });
    </script>
    
    <!-- Include Bootstrap JavaScript and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
